version: "3.9"

# Decompress — Local Containerised Development Specification
# Runs the Next.js full-stack server on port 3000 with Firebase Firestore & Auth.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
